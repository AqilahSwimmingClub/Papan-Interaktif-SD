<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 250px; flex: 0 0 250px; background: #103a56; color: #dce8f0; padding: 22px 0 20px; display: flex; flex-direction: column; gap: 16px; font-family: 'Public Sans', Helvetica, Arial, sans-serif; align-self: stretch;">
  <div style="padding: 0 20px;">
    <div style="display: flex; align-items: center; gap: 11px;">
      <div style="width: 38px; height: 38px; border-radius: 9px; background: #2f8fc7; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff;">PI</div>
      <div style="min-width: 0;">
        <div style="font-weight: 700; font-size: 13.5px; color: #fff;">Papan Interaktif SD</div>
        <div style="font-size: 11.5px; color: #8fb4cc; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">SDN Satria Jaya 01</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 1px;">
    <div style="padding: 8px 20px 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.09em; color: #6f9ab5;">MENGAJAR</div>
    <sc-for list="{{ mengajar }}" as="it" hint-placeholder-count="4">
      <div style="{{ it.style }}">{{ it.label }}</div>
    </sc-for>
    <div style="padding: 16px 20px 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.09em; color: #6f9ab5;">BUAT DENGAN AI</div>
    <sc-for list="{{ ai }}" as="it" hint-placeholder-count="4">
      <div style="{{ it.style }}">{{ it.label }}</div>
    </sc-for>
    <div style="padding: 16px 20px 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.09em; color: #6f9ab5;">KELAS &amp; DATA</div>
    <sc-for list="{{ data }}" as="it" hint-placeholder-count="3">
      <div style="{{ it.style }}">{{ it.label }}</div>
    </sc-for>
    <div style="padding: 16px 20px 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.09em; color: #6f9ab5;">LAINNYA</div>
    <sc-for list="{{ lainnya }}" as="it" hint-placeholder-count="2">
      <div style="{{ it.style }}">{{ it.label }}</div>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 14px 20px 0; border-top: 1px solid #1d4d6d; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #4fc08d;"></span>
      <span style="font-size: 12px; color: #9dc0d4;">Offline siap &middot; backup 21 Agu</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #2f8fc7; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: #fff;">SR</div>
      <div style="font-size: 12px; line-height: 1.35; min-width: 0;">
        <div style="color: #fff; font-weight: 600;">Bu Sri Rahayu</div>
        <div style="color: #8fb4cc;">Guru Kelas 4</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:250,&quot;height&quot;:700},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dasbor&quot;,&quot;Kelas &amp; Mapel&quot;,&quot;Papan Interaktif&quot;,&quot;Game Edukasi&quot;,&quot;Pembuat LKPD&quot;,&quot;Pembuat Soal&quot;,&quot;Game Generator&quot;,&quot;Data Siswa&quot;,&quot;Penilaian&quot;,&quot;Leaderboard&quot;,&quot;Perpustakaan&quot;,&quot;Pengaturan&quot;],&quot;default&quot;:&quot;Dasbor&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  build(labels) {
    const active = this.props.active ?? "Dasbor";
    const on = "display:flex;align-items:center;padding:9px 20px;font-size:13px;font-weight:600;background:#1b5e8c;color:#fff;border-left:3px solid #6cc0f0;cursor:pointer";
    const off = "display:flex;align-items:center;padding:9px 20px;font-size:13px;color:#b9d2e0;border-left:3px solid transparent;cursor:pointer";
    return labels.map(label => ({ label, style: label === active ? on : off }));
  }
  renderVals() {
    return {
      mengajar: this.build(["Dasbor", "Kelas & Mapel", "Papan Interaktif", "Game Edukasi"]),
      ai: this.build(["Pembuat LKPD", "Pembuat Soal", "Game Generator"]),
      data: this.build(["Data Siswa", "Penilaian", "Leaderboard"]),
      lainnya: this.build(["Perpustakaan", "Pengaturan"])
    };
  }
}
</script>
</body>
</html>
